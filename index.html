<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jonathan Díaz-Vreys — Data, BI & IA</title>
  <meta name="description" content="Portfolio de Jonathan Díaz-Vreys, ingénieur Data, BI & IA en alternance : data engineering, Power BI, data warehouse et IA générative.">
  <meta property="og:title" content="Jonathan Díaz-Vreys — Data, BI & IA">
  <meta property="og:description" content="Ingénieur Data, BI & IA en alternance — portfolio.">
  <meta property="og:image" content="assets/img/hero-poster.jpg">
  <meta name="theme-color" content="#06060c">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Loader trou noir -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="blackhole">
      <div class="blackhole-disc"></div>
      <div class="blackhole-core"></div>
      <svg class="blackhole-text" viewBox="0 0 200 200">
        <defs><path id="orbit" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"></path></defs>
        <text><textPath href="#orbit" data-i18n="loading" id="loader-text">chargement · chargement · chargement · </textPath></text>
      </svg>
    </div>
  </div>

  <canvas id="stars" aria-hidden="true"></canvas>

  <!-- HERO -->
  <header class="hero" id="home">
    <video class="hero-video" autoplay muted loop playsinline poster="assets/img/hero-poster.jpg">
      <source src="assets/video/hero.mp4" type="video/mp4">
    </video>
    <div class="hero-shade"></div>

    <button class="square" id="square" type="button" aria-describedby="hero-quote">
      <span class="square-face square-front">
        <span class="hero-name" data-bind="name"></span>
        <span class="hero-role" data-i18n="role"></span>
      </span>
      <span class="square-face square-back" id="hero-quote" data-i18n="quote"></span>
    </button>

    <p class="status"><span class="dot"></span><span data-i18n="status"></span></p>

    <a class="scroll-cue" href="#about"><span data-i18n="scroll"></span><span class="chev"></span></a>
  </header>

  <main>
    <!-- ABOUT -->
    <section class="section" id="about">
      <h2 class="section-title"><span class="idx">01</span><span data-i18n="aboutTitle"></span></h2>
      <div class="about-grid">
        <div class="about-photo reveal">
          <div class="orbit-ring"><span class="planet"></span></div>
          <img data-bind-src="photo" alt="Jonathan Díaz-Vreys" width="200" height="200">
        </div>
        <div class="about-text reveal" id="about-text"></div>
      </div>

      <div class="about-cards">
        <div class="card reveal">
          <h3 data-i18n="factsTitle"></h3>
          <dl class="facts" id="facts"></dl>
        </div>
        <div class="card reveal">
          <h3 data-i18n="langsTitle"></h3>
          <ul class="langs" id="langs"></ul>
        </div>
        <div class="card reveal">
          <h3 data-i18n="hobbiesTitle"></h3>
          <ul class="chips" id="hobbies"></ul>
        </div>
      </div>
    </section>

    <!-- JOURNEY -->
    <section class="section" id="journey">
      <h2 class="section-title"><span class="idx">02</span><span data-i18n="journeyTitle"></span></h2>
      <div class="journey-grid">
        <div>
          <h3 class="sub" data-i18n="workTitle"></h3>
          <ol class="timeline" id="work"></ol>
        </div>
        <div>
          <h3 class="sub" data-i18n="eduTitle"></h3>
          <ol class="timeline compact" id="education"></ol>
        </div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="section" id="projects">
      <h2 class="section-title"><span class="idx">03</span><span data-i18n="projectsTitle"></span></h2>

      <article class="featured reveal" id="featured">
        <div class="featured-visual" aria-hidden="true">
          <svg viewBox="0 0 320 220" class="scan">
            <defs>
              <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#9fb4ff" stop-opacity=".18"/>
                <stop offset="1" stop-color="#ff7a59" stop-opacity=".12"/>
              </linearGradient>
            </defs>
            <rect x="30" y="30" width="260" height="160" rx="6" fill="url(#glass)" stroke="currentColor" stroke-opacity=".35"/>
            <g stroke="currentColor" stroke-opacity=".08">
              <path d="M30 70h260M30 110h260M30 150h260M82 30v160M134 30v160M186 30v160M238 30v160"/>
            </g>
            <g class="defects">
              <circle cx="96" cy="84" r="3"/><circle cx="210" cy="132" r="2.5"/><circle cx="162" cy="62" r="2"/><circle cx="250" cy="170" r="3"/>
            </g>
            <g class="boxes">
              <rect x="86" y="74" width="20" height="20"/><rect x="200" y="122" width="20" height="20"/>
              <rect x="152" y="52" width="20" height="20"/><rect x="240" y="160" width="20" height="20"/>
            </g>
            <rect class="beam" x="30" y="30" width="3" height="160"/>
          </svg>
        </div>
        <div class="featured-body">
          <p class="eyebrow" data-i18n="featured"></p>
          <h3 data-k="title"></h3>
          <p class="meta" data-k="meta"></p>
          <p data-k="summary"></p>
          <ul class="bullets" data-k="points"></ul>
          <ul class="chips small" data-k="tags"></ul>
        </div>
      </article>

      <h3 class="sub" data-i18n="academicTitle"></h3>
      <div class="projects-grid" id="project-grid"></div>
    </section>

    <!-- SKILLS -->
    <section class="section" id="skills">
      <h2 class="section-title"><span class="idx">04</span><span data-i18n="skillsTitle"></span></h2>
      <div class="skills-grid" id="skill-grid"></div>
      <div class="card soft reveal">
        <h3 data-i18n="softTitle"></h3>
        <ul class="chips" id="soft"></ul>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section contact" id="contact">
      <h2 class="section-title"><span class="idx">05</span><span data-i18n="contactTitle"></span></h2>
      <p class="contact-lead reveal" data-i18n="contactLead"></p>
      <a class="email-big reveal" id="email-link" href="#"><span data-bind="email"></span></a>
      <div class="contact-actions reveal">
        <a class="btn primary" id="email-btn" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m3 7 9 6 9-6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span data-i18n="contactCta"></span>
        </a>
        <button class="btn" id="copy-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span data-i18n="copy" id="copy-label"></span>
        </button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> · <span data-i18n="footer"></span></p>
  </footer>

  <!-- DOCK -->
  <nav class="dock" aria-label="Navigation">
    <a href="#home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg><span class="tip"></span></a>
    <a href="#about" data-nav="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="tip"></span></a>
    <a href="#journey" data-nav="journey"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span class="tip"></span></a>
    <a href="#projects" data-nav="projects"><svg viewBox="0 0 24 24"><path d="M17 21l-5-4-5 4V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1z"/></svg><span class="tip"></span></a>
    <a href="#skills" data-nav="skills"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span class="tip"></span></a>
    <a href="#contact" data-nav="contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="tip"></span></a>
    <span class="dock-sep"></span>
    <button type="button" id="lang-btn" class="lang"><span id="lang-label">EN</span><span class="tip"></span></button>
  </nav>

  <!-- Fenêtre de détail projet -->
  <dialog class="modal" id="modal">
    <button class="modal-close" id="modal-close" type="button" aria-label="Fermer">×</button>
    <div id="modal-body"></div>
  </dialog>

  <noscript><p style="padding:2rem;color:#fff">Ce site nécessite JavaScript. Contact : jonathanjosediazvreys@gmail.com</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
